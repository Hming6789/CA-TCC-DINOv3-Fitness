name: AI application CI and image delivery
on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-web*.txt
      - run: pip install -r requirements-web-dev.txt -c requirements-web-lock.txt ruff==0.14.3
      - run: pip check
      - name: Static checks
        run: ruff check webapp scripts/container_smoke.py --select E9,F63,F7,F82
      - name: Unit and ONNX integration tests (disposable fixtures)
        run: |
          set -o pipefail
          python -m unittest webapp.test_webapp -v 2>&1 | tee tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: functional-test-evidence
          path: tests.txt
  container:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: vhm-motion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start, smoke and restart preview
        run: |
          docker run -d --name vhm-ci -p 127.0.0.1:8000:8000 vhm-motion:ci
          python scripts/container_smoke.py
          test "$(docker exec vhm-ci id -u)" = 10001
          docker restart vhm-ci
          python scripts/container_smoke.py
      - name: Logs and cleanup
        if: always()
        run: |
          docker logs vhm-ci > container.txt 2>&1 || true
          docker rm -f vhm-ci || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-evidence
          path: container.txt
  publish:
    needs: [quality, container]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/vhm-motion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release and tags
        id: tags
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$IMAGE" != '/vhm-motion' || { echo 'Configure Docker Hub secrets'; exit 1; }
          TAGS="$IMAGE:sha-$GITHUB_SHA"
          if [[ "$REF" == refs/tags/* ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            TAGS="$TAGS,$IMAGE:$REF_NAME"
          else
            TAGS="$TAGS,$IMAGE:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          provenance: mode=min
          sbom: true
      - name: Verify anonymous public pull and boot by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker" docker pull "$IMAGE@$DIGEST"
          docker run -d --name published -p 127.0.0.1:8000:8000 "$IMAGE@$DIGEST"
          python scripts/container_smoke.py
          printf 'Image: %s\nTags: %s\nDigest: %s\n' "$IMAGE" "$TAGS" "$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: docker rm -f published || true
